name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint files
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Typecheck files
        run: bun run typecheck

      - name: Check Expo Go example dependencies
        run: bun --cwd example expo install --check

      - name: Typecheck Expo Go example
        run: bun --cwd example tsc --noEmit

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run unit tests
        run: bun run test --maxWorkers=2 --coverage --passWithNoTests

  build-library:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: bun run prepare

  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build example for Web
        run: bun --cwd kitchen-sink expo export --platform web

      - name: Bundle Expo Go example
        run: bun --cwd example expo export --platform ios --platform android --source-maps

      - name: Check Expo Go bundle package resolution
        run: node scripts/check-expo-go-bundle.cjs example/dist
