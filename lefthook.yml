pre-commit:
  parallel: true
  commands:
    lint:
      glob: '*.{js,ts,jsx,tsx}'
      run: bunx oxlint {staged_files}
    format:
      glob: '*.{js,ts,jsx,tsx,json,jsonc,yml,yaml,md}'
      run: bunx oxfmt --check {staged_files}
    types:
      glob: '*.{js,ts,jsx,tsx}'
      run: bunx tsc && bunx tsc --project kitchen-sink/tsconfig.json
